name: REALM account deletion
description: Do not post your Google email here. Use the private website form.
title: "Do not use — open the private deletion page"
labels: ["account-deletion"]
body:
  - type: markdown
    attributes:
      value: |
        **Do not write your Google email in this issue.** Issues on this repository are public.

        Delete a REALM account from the app (REALM 1.2.3 Profile → Delete Account) or from the private form:

        https://aetherrealmapp.github.io/delete-account/

        That form sends the email only to REALM’s backend. It is not published here.
  - type: checkboxes
    id: redirect
    attributes:
      label: Use the private form
      options:
        - label: I will use https://aetherrealmapp.github.io/delete-account/ and I will not post my Google email in this public issue.
          required: true
